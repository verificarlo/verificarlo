name: clang-format-lint
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: DoozyX/clang-format-lint-action@v0.20
      with:
        exclude: './tests'
        style: 'LLVM'
        clangFormatVersion: 20
